<div class="account-field{% if field.errors %} has-error{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% if field.errors %}<div id="{{ field.auto_id }}_error">{% for error in field.errors %}<p class="account-field-error">{{ error }}</p>{% endfor %}</div>{% endif %}</div>
