<div class="proc-field{% if wide %} proc-field-wide{% endif %}{% if field.errors %} proc-field-error{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="proc-required" aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small class="proc-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}{% if field.errors %}<div id="{{ field.auto_id }}_error">{% for error in field.errors %}<p class="proc-error" role="alert">{{ error }}</p>{% endfor %}</div>{% endif %}</div>
