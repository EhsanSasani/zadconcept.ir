<form class="proc-period" method="get" aria-label="بازهٔ دفتر"><button name="period" value="custom" type="submit" hidden>نمایش بازه</button><div class="proc-period-chips">{% for value,label in quick_periods %}<button type="submit" name="period" value="{{ value }}"{% if period.choice == value %} aria-pressed="true"{% else %} aria-pressed="false"{% endif %}>{{ label }}</button>{% empty %}<button type="submit" name="period" value="today"{% if period.choice == 'today' %} aria-pressed="true"{% endif %}>امروز</button><button type="submit" name="period" value="7"{% if period.choice == '7' %} aria-pressed="true"{% endif %}>۷ روز</button><button type="submit" name="period" value="30"{% if period.choice == '30' %} aria-pressed="true"{% endif %}>۳۰ روز</button><button type="submit" name="period" value="90"{% if period.choice == '90' %} aria-pressed="true"{% endif %}>۳ ماه</button>{% endfor %}</div><details{% if period.error %} open{% endif %}><summary>بازهٔ دلخواه <span aria-hidden="true">⌄</span></summary><div class="proc-period-fields">{% if period.error %}<p class="proc-error" role="alert">{{ period.error }}</p>{% endif %}<label for="proc-period-start">از تاریخ شمسی<input id="proc-period-start" name="start_jalali" value="{{ period.input_start }}" dir="ltr" placeholder="۱۴۰۵/۰۷/۰۱" maxlength="10"></label><label for="proc-period-end">تا تاریخ شمسی<input id="proc-period-end" name="end_jalali" value="{{ period.input_end }}" dir="ltr" placeholder="۱۴۰۵/۰۷/۳۰" maxlength="10"></label><button class="proc-btn proc-primary" type="submit" name="period" value="custom">نمایش</button></div></details><small class="proc-period-caption">{{ period.start_jalali }} تا {{ period.end_jalali }}</small></form>
