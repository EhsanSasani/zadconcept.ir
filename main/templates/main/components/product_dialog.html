<div class="zad-product-modal" data-product-modal hidden>
  <div class="zad-product-modal__overlay" data-product-modal-close aria-hidden="true"></div>

  <div class="zad-product-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="zad-product-modal-title" aria-describedby="zad-product-modal-description" tabindex="-1">
    <button type="button" class="zad-product-modal__close" data-product-modal-close aria-label="بستن پنجره محصول">
      ×
    </button>

    <div class="zad-product-modal__media">
      <img alt="" data-modal-image width="1100" height="1300" decoding="async">
    </div>

    <div class="zad-product-modal__content">
      <span class="zad-product-modal__type" data-modal-type></span>

      <h2 id="zad-product-modal-title" data-modal-title></h2>
      <p class="zad-product-modal__code" data-modal-code hidden></p>

      <div class="zad-product-modal__line"></div>

      <p class="zad-product-modal__text" id="zad-product-modal-description" data-modal-description>
        این محصول به صورت اختصاصی و با توجه به موجودی روز طراحی و آماده می‌شود.
      </p>

      <p class="zad-product-modal__price" data-modal-price></p>
      <p class="zad-product-modal__stock" data-modal-stock></p>

      <div class="zad-product-modal__notice">
        <strong>استعلام و سفارش اختصاصی</strong>
        <span data-modal-contact>برای قیمت و ثبت سفارش با ما در ارتباط باشید.</span>
      </div>

      <a class="zad-product-modal__detail" data-modal-detail>مشاهدهٔ جزئیات و تصاویر <span aria-hidden="true">←</span></a>

      <div class="zad-product-modal__actions">
        <a href="{{ site_call_href }}" class="zad-product-modal__btn" data-cta-position="product-modal-call">
          تماس
        </a>

        <a
          href="{{ site_telegram_url|default:'#' }}"
          target="_blank"
          rel="noopener"
          class="zad-product-modal__btn zad-product-modal__btn--ghost"
          data-cta-position="product-modal-telegram"
        >
          تلگرام
        </a>

        <a
          href="{{ site_bale_url }}"
          target="_blank"
          rel="noopener"
          class="zad-product-modal__btn zad-product-modal__btn--bale"
          data-cta-position="product-modal-bale"
          aria-label="سفارش محصول در بله"
        >
          بله
        </a>
      </div>
    </div>
  </div>
</div>
