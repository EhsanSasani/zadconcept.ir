{% if filter_items %}
<nav class="catalog-filter" aria-label="{{ filter_label|default:'فیلتر نوع محصول' }}">
  <ul
    class="catalog-filter__grid"
    data-filter-count="{{ filter_items|length }}"
    {% if ajax_filter %}data-catalog-filter{% endif %}
  >
    {% for item in filter_items %}
      <li class="catalog-filter__item">
        <a
          href="{{ item.url }}"
          class="catalog-filter-card{% if item.is_active %} is-active{% endif %}"
          {% if item.filter_url %}data-filter-target="{{ item.filter_url }}"{% endif %}
          {% if ajax_filter %}data-filter="{{ item.filter_value }}"{% endif %}
          {% if item.is_active %}aria-current="page"{% endif %}
        >
          {% include "main/components/catalog_filter_icon.html" with slug=item.slug section=item.section only %}
          <span class="catalog-filter-card__label">{{ item.label }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
{% endif %}
