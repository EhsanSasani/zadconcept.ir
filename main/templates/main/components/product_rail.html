{% load static %}

<div class="featured-products" data-featured-slider>
  {% if products %}
    <button class="featured-products__nav featured-products__nav--prev" type="button" aria-label="Previous products" data-featured-prev>
      ‹
    </button>

    <div class="featured-products__viewport" data-featured-viewport>
      <div class="featured-products__track" data-featured-track>
        {% include "main/components/product_card.html" with products=products fallback_image="main/img/cat-flowers.webp" %}
      </div>
    </div>

    <button class="featured-products__nav featured-products__nav--next" type="button" aria-label="Next products" data-featured-next>
      ›
    </button>
  {% else %}
    <div class="empty-box">No products are available yet.</div>
  {% endif %}
</div>
