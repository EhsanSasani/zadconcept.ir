{% load studio_ui %}
<section class="panel split-panel"><div class="panel-head"><div><p class="eyebrow">PRODUCT MIX</p><h2>ترکیب تولید</h2></div><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg></div>
<div class="split-body"><div class="donut"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="donut-base{% if not stats.produced %} donut-empty{% endif %}" cx="50" cy="50" r="39"/><circle class="donut-daily" cx="50" cy="50" r="39" pathLength="100" stroke-dasharray="{{ daily|percent:stats.produced }} 100"/></svg><div class="donut-hole"><strong>{{ stats.produced|fa_number }}</strong><small>مجموع تولید</small></div></div>
<div class="split-legend"><div><span><i class="legend-dot pink"></i>روزانه</span><strong>{{ daily|fa_number }}</strong><small>{{ daily|percent:stats.produced|fa_number }}٪ از کل</small></div><div><span><i class="legend-dot green"></i>سفارشی</span><strong>{{ custom|fa_number }}</strong><small>{{ custom|percent:stats.produced|fa_number }}٪ از کل</small></div></div></div></section>
