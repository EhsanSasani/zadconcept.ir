{% load studio_ui %}<article class="app-product-tile">
{% if row.photo_url %}<button type="button" class="app-product-photo" data-photo="{{ row.photo_url }}" data-caption="{{ row.get_product_type_display }} · {{ row.factor_code }}" aria-label="نمایش عکس فاکتور {{ row.factor_code }}"><img src="{{ row.photo_url }}" alt="{{ row.get_product_type_display }}" width="320" height="320" loading="lazy" decoding="async"></button>{% else %}<div class="app-product-photo app-photo-empty"><svg class="icon"><use href="#i-flower"/></svg><span>بدون تصویر</span></div>{% endif %}
<a class="app-product-copy" href="{% url 'studio_product_detail' row.pk %}"><strong class="app-price">{{ row.price|fa_number }} <small>تومان</small></strong><h3>{{ row.get_product_type_display }}</h3><span>{{ row.florist.name }}</span><span class="app-factor" dir="ltr">#{{ row.factor_code }}</span></a></article>
