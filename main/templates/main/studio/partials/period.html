<form class="period-bar" method="get" aria-label="بازه گزارش">
  {% for key,value in period_filters %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
  <div class="segmented" role="group" aria-label="بازه‌های سریع">
    <button name="period" value="today" class="period-chip{% if period.choice == 'today' %} selected{% endif %}" aria-pressed="{% if period.choice == 'today' %}true{% else %}false{% endif %}">امروز</button>
    <button name="period" value="7" class="period-chip{% if period.choice == '7' %} selected{% endif %}" aria-pressed="{% if period.choice == '7' %}true{% else %}false{% endif %}">۷ روز</button>
    <button name="period" value="30" class="period-chip{% if period.choice == '30' %} selected{% endif %}" aria-pressed="{% if period.choice == '30' %}true{% else %}false{% endif %}">۳۰ روز</button>
    <button name="period" value="90" class="period-chip{% if period.choice == '90' %} selected{% endif %}" aria-pressed="{% if period.choice == '90' %}true{% else %}false{% endif %}">۳ ماه</button>
  </div>
  <span class="period-range"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg><time data-persian-date="{{ period.start|date:'Y-m-d' }}">{{ period.start|date:'Y/m/d' }}</time><span>تا</span><time data-persian-date="{{ period.end|date:'Y-m-d' }}">{{ period.end|date:'Y/m/d' }}</time></span>
  <details class="custom-period"><summary>بازه دلخواه <svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></summary><div class="custom-popover"><p>تاریخ ورودی به میلادی است.</p><label>از تاریخ<input type="date" name="start" value="{{ period.start|date:'Y-m-d' }}"></label><label>تا تاریخ<input type="date" name="end" value="{{ period.end|date:'Y-m-d' }}"></label><button name="period" value="custom" class="btn btn-primary">نمایش گزارش</button></div></details>
</form>
