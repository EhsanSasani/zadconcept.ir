{% load studio_ui %}{% if page.has_other_pages %}<nav class="shop-pagination" aria-label="صفحه‌های نتایج">{% if page.has_previous %}<a href="?q={{ query|urlencode }}&amp;category={{ selected_category|urlencode }}&amp;status={{ selected_status|urlencode }}&amp;page={{ page.previous_page_number }}">قبلی</a>{% endif %}<span>صفحه {{ page.number|fa_number }} از {{ page.paginator.num_pages|fa_number }}</span>{% if page.has_next %}<a href="?q={{ query|urlencode }}&amp;category={{ selected_category|urlencode }}&amp;status={{ selected_status|urlencode }}&amp;page={{ page.next_page_number }}">بعدی</a>{% endif %}</nav>{% endif %}
