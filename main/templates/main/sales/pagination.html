{% if page.has_other_pages %}<nav class="pagination" aria-label="صفحه‌بندی">{% if page.has_previous %}<a href="?tab={{ tab }}&q={{ q|urlencode }}&page={{ page.previous_page_number }}">قبلی</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?tab={{ tab }}&q={{ q|urlencode }}&page={{ page.next_page_number }}">بعدی</a>{% endif %}</nav>{% endif %}
