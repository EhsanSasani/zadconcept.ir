{% if messages %}
  <div class="container alerts">
    {% for message in messages %}
      <div class="alert {{ message.tags }}"{% if 'error' in message.tags %} role="alert"{% else %} role="status"{% endif %} aria-atomic="true"{% if 'lead-success' in message.tags %} data-lead-success{% endif %}>{{ message }}</div>
    {% endfor %}
  </div>
{% endif %}
