<div class="top-notice-bar">
  <a href="{{ site_telegram_url }}" target="_blank" rel="noopener" class="top-notice-bar__link">
    برای سفارش محصولات زاد از خارج از ایران و پرداخت از طریق
    <strong class="top-notice-bar__paypal">PayPal</strong>
    با شماره
    <bdi dir="ltr">+989154203569</bdi>
    در تلگرام با ما در تماس باشید.
  </a>
</div>

<header class="site-header" data-site-header>
  <div class="container nav-wrap">
    <a class="brand brand--text" href="{% url 'index' %}" aria-label="صفحه اصلی زاد">
      <span class="brand__name">ZAD</span>
      <span class="brand__sub">flowerstore</span>
    </a>

    <nav class="main-nav" aria-label="ناوبری اصلی">
      <div class="main-nav__center">
        <a href="{% url 'index' %}" class="{% if active_nav == 'home' %}is-active{% endif %}"{% if active_nav == 'home' %} aria-current="page"{% endif %}>
          خانه
        </a>

        <details class="nav-dropdown" data-nav-dropdown>
          <summary
            class="nav-dropdown__trigger{% if active_nav == 'flowers' or active_nav == 'bakery' or active_nav == 'gifts' %} is-active{% endif %}"
            data-nav-dropdown-trigger
            aria-controls="product-navigation-menu"
          >
            محصولات
          </summary>

          <div class="nav-dropdown__menu" id="product-navigation-menu" data-nav-dropdown-menu>
            <a href="{% url 'flowers' %}"{% if active_nav == 'flowers' %} aria-current="page"{% endif %}>گل</a>
            <a href="{% url 'bakery' %}"{% if active_nav == 'bakery' %} aria-current="page"{% endif %}>سوییت بار</a>
            <a href="{% url 'gifts' %}"{% if active_nav == 'gifts' %} aria-current="page"{% endif %}>کانسپت استور</a>
          </div>
        </details>

        <a href="{% url 'weddings' %}" class="{% if active_nav == 'weddings' %}is-active{% endif %}"{% if active_nav == 'weddings' %} aria-current="page"{% endif %}>
          عروسی
        </a>

        <a href="{% url 'events' %}" class="{% if active_nav == 'events' %}is-active{% endif %}"{% if active_nav == 'events' %} aria-current="page"{% endif %}>
          ورکشاپ ها
        </a>
      </div>

      <a href="{% url 'about' %}" class="main-nav__about {% if active_nav == 'about' %}is-active{% endif %}"{% if active_nav == 'about' %} aria-current="page"{% endif %}>
        درباره زاد
      </a>
    </nav>
  </div>
</header>
<div class="site-header-spacer" aria-hidden="true"></div>
