{% load static %}

<article
  class="flowers-product-card wedding-product-card{% if product.stock_status == 'out_of_stock' %} flowers-product-card--out{% endif %}"
  data-catalog-card
  data-category="{{ product.category.slug|default:'uncategorized' }}"
  data-product-type="{{ product.category.slug|default:'collection' }}"
  data-product-type-label="{{ product.get_wedding_type_display }}"
  data-product-code="{{ product.product_code }}"
  data-product-name="{{ product.name|default:'' }}"
  data-product-price="{{ product.display_price }}"
  data-product-contact="{{ product.order_contact_text }}"
  data-product-stock="{{ product.stock_status_label }}"
  data-product-description="{{ product.description|default:''|truncatechars:140 }}"
>
  <a
    href="{{ product.get_absolute_url }}"
    class="flowers-product-card__main"
    data-zad-modal-card
  >
    <div class="flowers-product-card__media">
      {% if product.cover_image %}
        <img
          src="{{ product.cover_image.url }}"
          alt="{{ product.seo_name }}"
          {% if product.cover_srcset %}srcset="{{ product.cover_srcset }}"{% endif %}
          width="520"
          height="650"
          sizes="(max-width: 760px) 46vw, (max-width: 1100px) 31vw, 360px"
          loading="lazy"
          decoding="async"
          data-product-image
        >
      {% else %}
        <img
          src="{% static fallback_image|default:'main/img/cat-flowers.webp' %}"
          alt="{{ product.seo_name }}"
          width="520"
          height="650"
          sizes="(max-width: 760px) 46vw, (max-width: 1100px) 31vw, 360px"
          loading="lazy"
          decoding="async"
          data-product-image
        >
      {% endif %}
    </div>

    <div class="flowers-product-card__body wedding-product-card__body">
      <span class="wedding-product-card__code" dir="ltr">
        {{ product.product_code }}
      </span>
    </div>
  </a>
</article>
