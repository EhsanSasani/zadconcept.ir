server {
    server_name 2.144.13.132  zadconcept.ir www.zadconcept.ir  ;

    client_max_body_size 20M;

    location = /49690323.txt {
        root /var/www/zad/app;
        default_type text/plain;
        }

    location /static/ {
        alias /var/www/zad/app/staticfiles/;
    }

    location ^~ /media/stories/source/ {
    return 404;
    }





    location /media/ {
        alias /var/www/zad/app/media/;
    }




location ^~ /admin/ {
    client_max_body_size 110M;

    proxy_pass http://unix:/var/www/zad/zad.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
}




    location / {
        proxy_pass http://unix:/var/www/zad/zad.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.zadconcept.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.zadconcept.ir/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}

server {
    if ($host = zadconcept.ir) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.zadconcept.ir) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name 2.144.13.132  zadconcept.ir www.zadconcept.ir  ;
    return 404; # managed by Certbot




}
