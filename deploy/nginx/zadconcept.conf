# Shared edge rate-limit zone. This file is included inside nginx's http{} context.
limit_req_zone $binary_remote_addr zone=zad_lead_limit:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name zadconcept.ir www.zadconcept.ir;
    return 301 https://www.zadconcept.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zadconcept.ir;

    ssl_certificate /etc/letsencrypt/live/zadconcept.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zadconcept.ir/privkey.pem;
    return 301 https://www.zadconcept.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zadconcept.ir;

    ssl_certificate /etc/letsencrypt/live/zadconcept.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zadconcept.ir/privkey.pem;

    client_max_body_size 12m;

    location /static/ {
        alias /var/www/zad/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /media/ {
        alias /var/www/zad/media/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location = /lead-request/ {
        limit_req zone=zad_lead_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/gunicorn-zad.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn-zad.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
